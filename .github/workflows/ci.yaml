name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://reelingo:reelingo@localhost:5432/reelingo_ci?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build
